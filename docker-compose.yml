services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan
      POSTGRES_PASSWORD: careplan
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: ./backend
    command: sh -c "python manage.py makemigrations careplan rag && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: careplan
      POSTGRES_USER: careplan
      POSTGRES_PASSWORD: careplan
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    depends_on:
      - db

volumes:
  pgdata:
