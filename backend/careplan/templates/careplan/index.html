<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Care Plan Generator</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 10px; font-weight: bold; }
  input { width: 100%; padding: 6px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 20px; }
  pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Care Plan Generator</h1>

  <form method="post">
    {% csrf_token %}
    <label>Patient Name</label>
    <input type="text" name="patient_name" required>

    <label>Patient DOB</label>
    <input type="text" name="patient_dob" placeholder="MM/DD/YYYY" required>

    <label>MRN</label>
    <input type="text" name="mrn" required>

    <label>Medication</label>
    <input type="text" name="drug_name" required>

    <label>Prescriber Name</label>
    <input type="text" name="provider_name" required>

    <label>Prescriber NPI</label>
    <input type="text" name="npi" required>

    <button type="submit">Generate Care Plan</button>
  </form>

  {% if care_plan %}
  <h2>Generated Care Plan</h2>
  <pre>{{ care_plan.content }}</pre>
  {% endif %}
</body>
</html>
