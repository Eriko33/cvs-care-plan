<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Care Plan Generator</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 10px; font-weight: bold; }
  input, textarea { width: 100%; padding: 6px; box-sizing: border-box; font-family: inherit; }
  textarea { resize: vertical; }
  button { margin-top: 16px; padding: 10px 20px; }
  pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Care Plan Generator</h1>

  <form method="post">
    {% csrf_token %}
    <label>Patient Name</label>
    <input type="text" name="patient_name" required>

    <label>Patient DOB</label>
    <input type="text" name="patient_dob" placeholder="MM/DD/YYYY" required>

    <label>MRN</label>
    <input type="text" name="mrn" required>

    <label>Weight</label>
    <input type="text" name="weight">

    <label>Allergies</label>
    <input type="text" name="allergies">

    <label>Primary Diagnosis</label>
    <input type="text" name="primary_diagnosis">

    <label>Medication</label>
    <input type="text" name="drug_name" required>

    <label>Home Meds</label>
    <input type="text" name="home_meds">

    <label>Prescriber Name</label>
    <input type="text" name="provider_name" required>

    <label>Prescriber NPI</label>
    <input type="text" name="npi" required>

    <label>Patient Records (paste clinical notes here)</label>
    <textarea name="patient_records" rows="12"></textarea>

    <button type="submit">Generate Care Plan</button>
  </form>

  {% if care_plan %}
  <h2>Generated Care Plan <small>(prompt version: {{ care_plan.prompt_version }})</small></h2>
  <pre>{{ care_plan.content }}</pre>

  <details>
    <summary>Reference material used for this generation</summary>
    <pre>{{ care_plan.reference_material }}</pre>
  </details>
  {% endif %}
</body>
</html>
